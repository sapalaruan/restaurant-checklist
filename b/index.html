<script>
/* ============================================================
   KONEKSYON — isang address lamang. Walang susi ng database dito.
   ============================================================ */
const API = 'https://bipeeundccfcntgzwkkk.supabase.co/functions/v1/branch';
const APP_VERSION = 'v2026.10.20-L252';

const LS = {
  get(k, d){ try{ const v=localStorage.getItem('blv_'+k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  // Ibinabalik kung NAITABI ba talaga. Mahalaga ito sa litrato: malaki ito,
  // at kapag napuno ang telepono, dating tahimik itong bumabagsak — at
  // aakalain ng staff na naitala na.
  set(k, v){ try{ localStorage.setItem('blv_'+k, JSON.stringify(v)); return true; }
             catch(e){ return false; } },
  del(k){ try{ localStorage.removeItem('blv_'+k); }catch(e){} }
};

let deviceToken = LS.get('device_token', null);
let deviceId    = LS.get('device_id', null);
let session     = LS.get('session', null);   // {token, store_id, staff_name, at}
let menu        = LS.get('menu', null);      // huling menu — gumagana offline
let dayState    = null;
let shiftMe     = null;   // {in:{...}|null, out:{...}|null} — ngayong araw lang
let route       = 'pos';
let cart        = [];
let queue       = LS.get('queue', []);       // mga hindi pa naipapadala
let whoList     = LS.get('who', null);      // pangalan sa login — gumagana offline
let pendingCarries = null;                  // padalang hinihintay pang tanggapin
let balikList      = null;                  // pangalan lang — WALANG dami (blind)
let countList      = null;                  // bilang ng hawak: pangalan lang din
let countDraft     = {};                    // ang tinipa nilang bilang
let countNote      = '';                    // tala ng nagbilang
let countResult    = null;                  // pagkakaiba, ipinapakita PAGKATAPOS isumite
let balikDraft     = {};
let rcvDraft       = {};
let carryMode      = null;                  // null | 'balik' | 'rcv:<id>'
// LOGBOOK. Ang talang hindi pa naipapadala ay nasa `queue` — kaya ang
// nakikita ay PINAGSAMA: ang galing sa server, at ang nasa pila pa.
let logRows        = null;                  // galing sa server
let logAbot        = null;                  // abot sa susunod na shift, hindi pa nabasa
let logDraft       = {kind:'', body:'', abot:false, tell:false};
let logOpen        = false;                 // bukas ba ang form?
// CHECKLIST. Opening, closing, at ang dalahin na kagamitan.
let ckRows         = null;                  // task + sagot ngayong araw
let ckSent         = null;                  // naisumite na ngayong araw
let ckPetsa        = null;
let ckPack         = null;                  // ang laging dinadala
let talaTab        = 'log';                 // 'log' | 'open' | 'close' | 'dala'
// Ang uri ng tala. Ikaw ang nagsabi ng halimbawa: "may sulat na natanggap".
const LOG_KINDS = [
  ['sulat',   '📨', 'Sulat / dokumento'],
  ['bisita',  '👤', 'Bisita / tao'],
  ['reklamo', '😠', 'Reklamo'],
  ['sira',    '🔧', 'Nasira / nabasag'],
  ['kuryente','⚡', 'Kuryente / tubig / gasul'],
  ['panahon', '🌧', 'Panahon'],
  ['abot',    '💬', 'Para sa susunod'],
  ['iba',     '📝', 'Iba pa']
];
const logKindLabel = (k)=>{
  const f=LOG_KINDS.find(x=>x[0]===k);
  return f ? f[1]+' '+f[2] : '📝 '+String(k||'');
};
let lastTouch   = Date.now();               // huling galaw ng tao
const IDLE_MS   = 30*60*1000;               // 30 minuto
let syncing     = false;
let busy        = false;

const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const peso = n => '₱' + (Math.round((Number(n)||0)*100)/100).toLocaleString('en-PH',
  {minimumFractionDigits:0, maximumFractionDigits:2});
// PARA SA PRINTER LANG.
//
// Ang ₱ ay U+20B1 — tatlong byte sa UTF-8. Ang murang thermal printer ay
// nagbabasa ng ISANG byte kada titik, ayon sa sarili niyang code page, at
// WALA sa kanila ang ₱. Kaya ang ₱10 ay lumalabas na "re 10": ang tatlong
// byte ay binabasa niyang tatlong magkaibang titik.
//
// Hindi ito kayang ayusin ng ibang pagsusulat — wala talagang ₱ sa mga
// code page ng ESC/POS. Ang nababasa at hindi nagsisinungaling ay "PHP".
const pesoP = n => 'PHP ' + (Math.round((Number(n)||0)*100)/100).toLocaleString('en-PH',
  {minimumFractionDigits:2, maximumFractionDigits:2});

function toast(msg, ms){
  const t=document.getElementById('toast');
  t.textContent=msg; t.style.display='block';
  clearTimeout(toast._t);
  toast._t=setTimeout(()=>{ t.style.display='none'; }, ms||2600);
}

/* Ang gabi ay natatapos ng 5:00 AM — ang order ng 1:30 AM ay kabilang pa rin
   sa gabi bago iyon. Kapareho ito ng kuwenta sa server. */
function businessDate(d){
  const t = d ? new Date(d) : new Date();
  const ph = new Date(t.toLocaleString('en-US',{timeZone:'Asia/Manila'}));
  ph.setHours(ph.getHours()-5);
  return ph.toLocaleDateString('en-CA');
}
function phTime(){
  return new Date().toLocaleTimeString('en-PH',
    {hour:'2-digit',minute:'2-digit',timeZone:'Asia/Manila'});
}
function uid(){
  const a=new Uint8Array(16); crypto.getRandomValues(a);
  return Array.from(a).map(x=>x.toString(16).padStart(2,'0')).join('');
}

/* ============================================================
   TAWAG SA PINTO
   ============================================================ */
async function call(path, body, opts){
  const h = {'Content-Type':'application/json'};
  // ANG SARILING TOKEN. Ginagamit lang ito ng naka-pilang LABAS: pagkatapos
  // ng logout ay wala nang session, pero kailangan pa ring maipadala ang
  // litrato ng paglabas kapag bumalik ang signal. Dala ng item ang token
  // nito mismo.
  const tok = (opts && opts.token) || (session && session.token) || null;
  if(tok) h['x-branch-session'] = tok;
  if(deviceToken) h['x-branch-token'] = deviceToken;
  const ctl = new AbortController();
  const to = setTimeout(()=>ctl.abort(), (opts&&opts.timeout)||12000);
  try{
    const r = await fetch(API+'/'+path, {method:'POST', headers:h,
      body: JSON.stringify(body||{}), signal: ctl.signal});
    clearTimeout(to);
    let j=null;
    try{ j = await r.json(); }catch(e){ j={ok:false, reason:'Hindi mabasa ang sagot ng server.'}; }
    // HUWAG PATAYIN ANG SESSION NG IBA. Kapag sariling token ang ginamit
    // (naka-pilang labas), ang patay na token na iyon ay HINDI dahilan para
    // itapon ang session ng taong nakapasok na ngayon.
    if(j && j.ok===false && !(opts && opts.token)
       && (j.code==='no_session'||j.code==='expired'||j.code==='revoked')){
      session=null; LS.del('session');
      if(j.code==='revoked'){ deviceToken=null; deviceId=null; LS.del('device_token'); LS.del('device_id'); }
      render();
    }
    return j;
  }catch(e){
    clearTimeout(to);
    return {ok:false, offline:true, reason:'Walang koneksyon.'};
  }
}

/* ============================================================
   PILA — ang order ay naitatala sa telepono BAGO pa subukang ipadala.
   Kahit mamatay ang signal sa gitna, hindi nawawala ang benta.
   ============================================================ */
function enqueue(kind, payload){
  queue.push({kind, payload, at: Date.now()});
  const ok = LS.set('queue', queue);
  // HINDI NAITABI SA TELEPONO. Nasa memorya pa ito at ipapadala kung may
  // signal, PERO mawawala kapag isinara ang app. Dapat niyang malaman —
  // ang tahimik na pagkawala ang pinakamasama.
  if(!ok){
    toast('⚠️ PUNO ANG TELEPONO. Hindi naitabi ang hindi pa naipapadala — '
         +'huwag isara ang app hangga\'t walang signal.', 9000);
  }
  updateBar();
  return ok;
}
async function syncQueue(silent){
  if(syncing) return;
  // Ang LABAS ay may sariling token, kaya naipapadala ito kahit wala nang
  // nakapasok. Kung hindi, maiiwan ang litrato ng paglabas hanggang sa
  // susunod na pasok — bukas na iyon, huli na ang balita.
  const mayShift = queue.some(x=>x.kind==='shift' && x.payload && x.payload.__tok);
  if(!session && !mayShift) return;
  if(!queue.length){ if(!silent) toast('Wala nang hinihintay.'); return; }
  syncing = true; updateBar();
  const left = [];
  for(const item of queue.slice()){
    let res;
    const sariling = item.kind==='shift' && item.payload && item.payload.__tok;
    // KAPAG WALANG NAKAPASOK, ang may sariling token lang ang pinapadala.
    // Kung hindi: sasagutin ng server ng no_session ang order, at ang
    // no_session ay HINDI offline — kaya ituturing itong "tinanggihan" at
    // ITATAPON ang benta. Nangyari na ba? Hindi — dahil dati ay umaatras
    // ang buong syncQueue kapag walang session. Ngayong hindi na, ito na
    // ang kumukupkop sa pila.
    if(!session && !sariling){ left.push(item); continue; }
    if(item.kind==='shift'){
      const p = Object.assign({}, item.payload); const t = p.__tok; delete p.__tok;
      res = await call(p.kind==='out' ? 'shift_out' : 'shift_in', p,
                       {timeout:60000, token:t||null});
    }
    else if(item.kind==='order') res = await call('order', {order:item.payload});
    else if(item.kind==='cash')  res = await call('cash',  {cash:item.payload});
    else if(item.kind==='carry') res = await call('carry', {carry:item.payload});
    else if(item.kind==='item')  res = await call('item',  {item:item.payload});
    else if(item.kind==='log')   res = await call('log_put', {entry:item.payload});
    // Ang litrato ng task — malaki ito, kaya isa-isa, at may mas mahabang
    // hintay bago sumuko.
    else if(item.kind==='taskphoto') res = await call('task_set', item.payload, {timeout:60000});
    else continue;
    const okOne = res && (res.ok===true) &&
      (!res.results || res.results.every(r=>r && r.ok!==false));
    if(!okOne){
      if(res && res.offline){ left.push(item); }         // subukan ulit mamaya
      else if(res && res.ok===false && !res.offline){
        // Tinanggihan ng server — hindi ito maaayos ng pag-uulit.
        console.error('itinapon ng server', item, res);
        toast('May hindi tinanggap: '+((res&&res.reason)||'?'), 5000);
      }
    }
  }
  queue = left; LS.set('queue', queue);
  syncing = false; updateBar();
  if(!silent && !queue.length) toast('✓ Naipadala lahat.');
  if(!queue.length) refreshState();
}
setInterval(()=>{ if(navigator.onLine) syncQueue(true); }, 25000);
window.addEventListener('online', ()=>syncQueue(true));

async function refreshState(){
  if(!session) return;
  const r = await call('state', {});
  if(r && r.ok){ dayState = r; updateBar(); if(route==='kaha'||route==='pos') render(); }
}
// KUSANG PAG-UPDATE. Ang bawat tab ay may sariling kailangan; ito ang kumukuha
// nito tuwing lumilipat ka, tuwing bumabalik ka sa app, at tuwing sandali
// habang nasa DALA. Walang pipindutin para lang makita ang bagong padala.
let __refreshing=false;
async function refreshFor(r, quiet){
  if(!session || !navigator.onLine || __refreshing) return;
  __refreshing=true;
  try{
    await refreshState();
    if(r==='carry'){
      const before=(pendingCarries||[]).length;
      await loadCarry();
      const after=(pendingCarries||[]).length;
      if(!quiet && after>before) toast('📦 May bagong padala mula sa Tinago.', 4000);
    }
    if(r==='tala'){
      if(talaTab==='log'){
        const before=(logAbot||[]).length;
        await loadLog();
        const after=(logAbot||[]).length;
        if(!quiet && after>before) toast('💬 May abot galing sa nakaraang shift.', 4000);
      } else {
        await loadTasks();
        if(talaTab==='dala') await loadPack();
      }
    }
  }catch(e){ /* tahimik — hindi ito dapat makasira ng screen */ }
  finally{ __refreshing=false; }
}
// Pagbalik sa app (naka-lock ang telepono, o lumipat ng app): sariwain agad.
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible' && session) refreshFor(route, true);
});
window.addEventListener('focus', ()=>{ if(session) refreshFor(route, true); });
// Habang nasa DALA, tumitingin kada 20 segundo — doon lang, para hindi
// sayangin ang data sa ibang screen.
setInterval(()=>{ if(session && route==='carry' && !carryMode) refreshFor('carry'); }, 20000);

function updateBar(){
  const b=document.getElementById('barsub');
  if(!b) return;
  const bits=[];
  if(session && session.staff_name) bits.push(session.staff_name);
  bits.push(businessDate());
  if(queue.length) bits.push('⏳ '+queue.length+' hindi pa naipapadala');
  else if(!navigator.onLine) bits.push('walang signal');
  b.textContent = bits.join(' · ');
}

/* ============================================================
   POS
   ============================================================ */
let posItem = null;     // napiling item, naghihintay ng laki
// ANG LASA. Pangatlong hakbang: item -> laki -> LASA. Ang listahan ay
// galing sa Modifiers file ng UTAK (naka-imbak sa server), kaya iisa ang
// susundan ng branch at ng counter sa Tinago. Ang 'single' na pangkat
// ay KAILANGANG pumili; ang 'multiple' ay pwedeng laktawan.
let posPick = null;     // {it, label, price} — napiling laki, naghihintay ng lasa
let posFlavors = {};    // {group: [title,...]} — ang napili kada pangkat
function cartTotal(){ return cart.reduce((t,l)=>t+(Number(l.line_total)||0), 0); }
// ANG PANGALAN NG BRANCH NA ITO. Tatlo na ang branch, kaya hindi na pwedeng
// "BOULEVARD" ang nakasulat sa itaas ng bawat telepono. Galing ito sa menu
// (naka-imbak, kaya gumagana offline); kung wala pa, ang store_id muna.
function branchName(){
  if(menu && menu.store_name) return menu.store_name;
  if(session && session.store_id) return session.store_id;
  return 'Branch';
}
function paintBranchName(){
  const el=document.getElementById('barbranch');
  if(el) el.textContent=String(branchName()).toUpperCase();
}
// Ang mga pangkat ng lasa ng isang item. Walang pangkat = walang hakbang.
function flavorGroups(it){ return (it && it.flavor_groups) || []; }
function flavorNeeded(it){ return flavorGroups(it).length > 0; }
// Nasagot na ba lahat ng KAILANGAN?
function flavorMissing(it){
  return flavorGroups(it).filter(g=>g.required && !(posFlavors[g.group]||[]).length);
}
// Kabuuang dagdag na presyo ng napiling lasa.
function flavorAdd(it){
  let add=0;
  flavorGroups(it).forEach(g=>{
    (posFlavors[g.group]||[]).forEach(t=>{
      const o=(g.options||[]).find(x=>x.title===t);
      if(o) add += Number(o.add)||0;
    });
  });
  return add;
}
// Ang teksto ng lasa — ito ang lumalabas sa resibo at napupunta sa MAIN.
function flavorText(it){ return flavorList(it).join(', '); }
// Listahan ng napiling lasa — ito ang itinatago ng server sa
// branch_order_lines.modifiers (matagal nang naghihintay ang hanay na iyon).
function flavorList(it){
  const parts=[];
  flavorGroups(it).forEach(g=>{ (posFlavors[g.group]||[]).forEach(t=>parts.push(t)); });
  return parts;
}

/* ---- ANG BILANG PER DENOMINASYON ----
   Hiling ni Matt: "pwede bang ang ilagay ay denomination din tulad ng sa main
   app — 1000 x (kung ilang pcs) etc para di malilito ang staff?"

   PAREHONG denominasyon ng main app (PH_DENOMS doon), pareho ang pagkakasunod.
   Ang kabuuan ay KINAKALKULA — hindi na siya magbibilang sa isip, at hindi na
   siya makakapagsulat ng bilang na hindi tumutugma sa mga pirasong hawak niya. */
const PH_DENOMS=[1000,500,200,100,50,20,10,5,1,0.25];
function khDenomGrid(){
  return PH_DENOMS.map(dn=>{
    const lbl = dn>=1 ? ('₱'+dn) : '25¢';
    return `<div class="line" style="padding:3px 0;">
      <span style="min-width:64px;">${lbl}</span>
      <span style="opacity:.5;">×</span>
      <input type="number" inputmode="numeric" min="0" placeholder="0"
        data-denom="${dn}" style="max-width:110px; text-align:right; margin:0;">
    </div>`;
  }).join('')
  +`<div class="line" style="font-weight:700; border-top:1px solid var(--line); padding-top:6px;">
      <span>Kabuuan (auto)</span><span id="kh-denom-total">₱0.00</span></div>`;
}
function khDenomSum(){
  let s=0;
  document.querySelectorAll('[data-denom]').forEach(el=>{
    s += (parseFloat(el.value)||0) * parseFloat(el.dataset.denom);
  });
  return Math.round(s*100)/100;
}
function khDenomBreakdown(){
  const o={};
  document.querySelectorAll('[data-denom]').forEach(el=>{
    const q=parseFloat(el.value)||0; if(q>0) o[el.dataset.denom]=q;
  });
  return o;
}
function khDenomPaint(){
  const el=document.getElementById('kh-denom-total');
  if(el) el.textContent=peso(khDenomSum());
}

function viewCarry(){

  const pend = pendingCarries || [];
  const bl   = balikList || [];

  if(carryMode==='balik'){
    // BLIND: pangalan lang ang ibinibigay ng server — walang dami.
    return `<div class="card">
      <h2>BALIK — ang naiuwi</h2>
      <p class="hint">Bilangin ang natira sa bawat isa. <b>Hindi ipapakita kung ilan ang dinala</b> —
        ang totoong nabilang ang kailangan, hindi ang tamang sagot.</p>
      ${bl.length ? bl.map(x=>`<div class="line">
          <span style="flex:2">${esc(x.name)}<br><span class="hint">${esc(x.unit||'')}</span></span>
          <input inputmode="decimal" data-balik="${esc(x.ingredient_id)}"
            value="${balikDraft[x.ingredient_id]!=null?esc(String(balikDraft[x.ingredient_id])):''}"

        : '<p class="hint">Walang hawak ang '+esc(branchName())+' ngayon. Wala munang ibabalik.</p>'}
      ${bl.length?`<div class="sp"></div>
        <button id="bk-save">Isumite ang bilang</button>
        <p class="hint" style="margin-top:8px">Isang beses lang ito. Pagkatapos, hindi na mababago.</p>`:''}
      <div class="sp"></div>
      <button class="ghost" id="bk-cancel">Bumalik</button>
    </div>`;
  }

  // BILANG NG HAWAK — para masabi kung iba ang totoo sa sabi ng sistema.
  // BULAG ito: walang ipinapakitang dami habang nagbibilang. Kung makikita
  // ang sagot, ang sagot ang isusulat — hindi ang totoong nabilang.
  if(carryMode==='count'){
    if(countResult){
      const rows=countResult.rows||[];
      return `<div class="card">
        <h2>Naipadala ang bilang</h2>
        ${rows.length
          ? `<p class="hint"><b>${rows.length}</b> ang hindi tugma sa sabi ng sistema.
               Naipadala na ito kay Owner. <b>Wala pang nababago sa stock</b> —
               siya ang magpapasya.</p>
             ${rows.map(r=>`<div class="line">
               <span style="flex:1; min-width:0">${esc(r.name)}
                 <br><span class="hint">sistema: ${r.sistema} ${esc(r.unit||'')}</span></span>
               <span style="text-align:right"><b>${r.nabilang}</b>
                 <br><span class="hint" style="color:${Number(r.iba)>0?'var(--ok)':'var(--bad)'}">
                   ${Number(r.iba)>0?'+':''}${r.iba}</span></span>
             </div>`).join('')}`
          : `<p class="hint">Tugma ang lahat sa sabi ng sistema. Walang kailangang ayusin.</p>`}
        <div class="sp"></div>
        <button class="ghost" id="cnt-done">Tapos na</button>
      </div>`;
    }
    const cl=countList||[];
    return `<div class="card">
      <h2>Bilangin ang hawak namin</h2>
      <p class="hint">Ilagay ang <b>totoong nabilang</b> sa bawat isa.
        <b>Hindi ipapakita kung ano ang sabi ng sistema</b> — ang totoo ang kailangan,
        hindi ang tamang sagot. Lalabas ang pagkakaiba pagkatapos isumite.
        <br>Hindi ito nagpapalit ng stock: si Owner ang magpapasya.</p>
      ${cl.length ? cl.map(x=>`<div class="line">
          <span style="flex:1; min-width:0">${esc(x.name)}<br><span class="hint">${esc(x.unit||'')}</span></span>
          <input inputmode="decimal" data-cnt="${esc(x.ingredient_id)}"
            value="${countDraft[x.ingredient_id]!=null?esc(String(countDraft[x.ingredient_id])):''}"
            placeholder="0" style="flex:0 0 110px; max-width:110px; margin:0; text-align:right">
        </div>`).join('')
        : '<p class="hint">Walang naitalang hawak ang '+esc(branchName())+'. Wala munang bibilangin.</p>'}
      ${cl.length?`<div class="sp"></div>
        <input id="cnt-note" placeholder="Tala (opsyonal) — hal. nabasa, nalaglag"
          value="${esc(countNote||'')}">
        <div class="sp"></div>
        <button id="cnt-save">Isumite ang bilang</button>`:''}
      <div class="sp"></div>
      <button class="ghost" id="cnt-cancel">Bumalik</button>
    </div>`;
  }

  if(carryMode && carryMode.startsWith('rcv:')){
    const id = carryMode.slice(4);
    const c  = pend.find(x=>x.carry_id===id);
    if(!c){ carryMode=null; return viewCarry(); }
    return `<div class="card">
      <h2>Tanggapin ang padala</h2>
      <p class="hint">Mula kay ${esc(c.by_name||'?')} · ${esc(c.at||'')}.

      <button id="rcv-save">Tanggapin</button>
      <div class="sp"></div>
      <button class="ghost" id="rcv-cancel">Bumalik</button>
    </div>`;
  }

  return `<div class="card">
    <h2>Dala at balik</h2>

/* ============================================================
   CLAIM STUB — Web Bluetooth, Android lang
   ============================================================ */
let printer = null;
const ESC = {
  init:[0x1b,0x40], center:[0x1b,0x61,0x01], left:[0x1b,0x61,0x00],
  bold:[0x1b,0x45,0x01], nobold:[0x1b,0x45,0x00],
  big:[0x1d,0x21,0x11], normal:[0x1d,0x21,0x00], feed:[0x0a], cut:[0x1d,0x56,0x00]
};
function encLine(s){ return Array.from(new TextEncoder().encode(s+'\n')); }

async function connectPrinter(){
  if(!navigator.bluetooth){
    toast('Walang Bluetooth sa browser na ito. Kailangan ng Android Chrome.', 5000);
    return null;
  }
  const SERVICES = [
    {s:'000018f0-0000-1000-8000-00805f9b34fb', c:'00002af1-0000-1000-8000-00805f9b34fb'},
    {s:'0000ff00-0000-1000-8000-00805f9b34fb', c:'0000ff02-0000-1000-8000-00805f9b34fb'},
    {s:'e7810a71-73ae-499d-8c15-faa9aef0c3f2', c:'bef8d6c9-9c21-4c9e-b632-bd58c1009f9f'},
    {s:'49535343-fe7d-4ae5-8fa9-9fafd205e455', c:'49535343-8841-43f4-a8d4-ecbe34729bb3'}
  ];
  try{
    const dev = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true, optionalServices: SERVICES.map(x=>x.s)
    });
    const gatt = await dev.gatt.connect();
    for(const t of SERVICES){
      try{
        const svc = await gatt.getPrimaryService(t.s);
        const ch  = await svc.getCharacteristic(t.c);
        printer = {dev, ch};
        LS.set('printer_name', dev.name||'');
        return printer;
      }catch(e){ /* subukan ang susunod */ }
    }
    toast('Hindi makilala ang printer na ito.', 4000);
  }catch(e){
    if(e && e.name!=='NotFoundError') toast('Hindi nakakonekta: '+(e.message||''), 4000);
  }
  return null;
}

async function printStub(order){
  if(!printer || !printer.dev.gatt.connected){
    if(!await connectPrinter()) return false;
  }
  const L = [];
  const push = a => a.forEach(b=>L.push(b));
  // WALANG PANGALAN NG TINDAHAN SA ITAAS — hiniling ng Owner na tanggalin.
  push(ESC.init); push(ESC.center);
  push(ESC.big);
  push(encLine(order.order_no));
  push(ESC.normal); push(ESC.left);
  push(encLine('--------------------------------'));
  order.lines.forEach(l=>{
    push(encLine(l.qty+'x '+l.item_name.slice(0,22)));
    if(l.flavor) push(encLine('   '+String(l.flavor).slice(0,26)));
    push(encLine('              '+pesoP(l.line_total)));
  });
  push(encLine('--------------------------------'));
  push(ESC.bold);
  push(encLine('KABUUAN   '+pesoP(order.total)));
  push(ESC.nobold);
  if(order.discount_amount>0) push(encLine('Diskwento '+pesoP(order.discount_amount)));
  push(encLine('Bayad: '+(order.payment_type||'cash')));
  // SUKLI — para hindi na kailangang magkuwenta sa ulo ang cashier.
  // Cash lang: sa GCash at card ay walang sukli.
  if((order.payment_type||'cash')==='cash' && Number(order.cash_tendered)>0){
    push(encLine('Ibinayad   '+pesoP(order.cash_tendered)));
    push(ESC.bold);
    push(encLine('SUKLI      '+pesoP(Math.max(0, Number(order.cash_tendered)-Number(order.total||0)))));
    push(ESC.nobold);
  }
  push(encLine(''));
  push(encLine(businessDate()+'  '+phTime()));
  push(encLine('Cashier: '+(order.cashier_name||'')));
  push(encLine(''));
  push(ESC.center);
  push(encLine('CLAIM STUB'));
  push(encLine('hindi ito opisyal na resibo'));
  push(encLine('')); push(encLine('')); push(ESC.cut);

  // 20 byte kada padala — iyon ang kayang tanggapin ng murang BLE printer.
  const bytes = new Uint8Array(L);
  try{
    for(let i=0;i<bytes.length;i+=20){
      await printer.ch.writeValueWithoutResponse(bytes.slice(i, i+20));
      await new Promise(r=>setTimeout(r, 22));
    }
    return true;
  }catch(e){
    console.error('print', e);
    toast('Hindi na-print. May Reprint sa ilalim.', 4000);
    return false;
  }
}

/* ============================================================
   CAMERA SA LOOB NG APP + GPS
   ============================================================
   Hiling ni Matt: "gusto ko malaman what time sila nakapagbukas with picture
   ... na hindi nila iuupload ang picture ... with picture and GPS".

   WALANG FILE PICKER DITO. getUserMedia at canvas lang — kaya WALANG
   paraan para magpasok ng lumang litrato mula sa gallery. Iyon ang buong
   punto: ang litrato ay kinuha NGAYON, sa LUGAR na iyon.

   Ang oras ay oras ng TELEPONO sa sandali ng pagkuha. Kapag walang signal,
   naiipon ito at ipinapadala mamaya — pero ang oras ng PAGKUHA pa rin ang
   opisyal. Sinusukat ng server ang agwat, at may tanda kung kahina-hinala.

   Android Chrome lang ito — iyon naman ang branch app (doon din ang printer). */
let camStream = null;
let camTask   = null;    // {id, text} habang bukas ang camera
let camBusy   = false;
let camGps    = null;    // {lat,lng,acc} habang kinukuha

function gpsNow(){
  return new Promise(resolve=>{
    if(!navigator.geolocation){ resolve({err:'Walang GPS sa telepono.'}); return; }
    let best=null, id=null, done=false;
    const finish=()=>{
      if(done) return; done=true;
      try{ if(id!=null) navigator.geolocation.clearWatch(id); }catch(e){}
      resolve(best ? {lat:+best.coords.latitude.toFixed(6), lng:+best.coords.longitude.toFixed(6),
                      acc:Math.round(best.coords.accuracy)}
                   : {err:'Hindi makuha ang lokasyon.'});
    };
    try{
      id=navigator.geolocation.watchPosition(
        p=>{ if(!best || p.coords.accuracy<best.coords.accuracy) best=p;
             if(best && best.coords.accuracy<=15) finish(); },
        e=>{ if(!best && e && e.code===1){ done=true;
               try{ if(id!=null) navigator.geolocation.clearWatch(id); }catch(_){}
               resolve({err:'Hindi pinayagan ang Location. Buksan ito sa Settings.'}); } },
        {enableHighAccuracy:true, maximumAge:0, timeout:20000});
    }catch(e){ finish(); return; }
    setTimeout(finish, 12000);
  });
}

// purpose: 'task' (checklist) o 'shift' (pasok/labas). Ang 'task' ang
// default, kaya walang nagbago sa dating tawag.
async function camOpen(taskId, text, purpose, kind){
  if(camBusy) return;
  camBusy=true;
  camTask={id:taskId, text:text, purpose:purpose||'task', kind:kind||null}; camGps=null;
  render();
  // Simulan agad ang GPS — matagal ito, habang nakatutok pa lang siya.
  gpsNow().then(g=>{ camGps=g; const el=document.getElementById('cam-gps');
    if(el) el.innerHTML = g.err ? '⚠️ '+esc(g.err)
      : '📍 Nakuha ang lokasyon (±'+g.acc+'m)'; });
  try{
    camStream = await navigator.mediaDevices.getUserMedia(
      {video:{facingMode:{ideal:'environment'}, width:{ideal:1280}}, audio:false});
  }catch(e){
    camClose();
    toast('Hindi mabuksan ang camera. I-allow ang Camera sa Settings.', 5000);
    camBusy=false;
    return;
  }
  // ANG PREVIEW AY HIWALAY NA USAPIN. Kung pumalya ito — tumanggi ang
  // autoplay, o ayaw tumanggap ng srcObject — BUHAY pa rin ang camera at
  // pwede pa ring kumuha. Dati, ang palyadong preview ay pumapatay ng buong
  // pagkuha, at ang sabi sa staff ay "hindi mabuksan ang camera" kahit
  // bukas naman.
  try{
    const v=document.getElementById('cam-video');
    if(v){
      try{ v.srcObject=camStream; }catch(e2){}
      const pr=v.play();
      if(pr && pr.catch) pr.catch(()=>{});
    }
  }catch(e){ /* walang preview; kaya pa ring kumuha */ }
  camBusy=false;
}
function camClose(){
  try{ if(camStream) camStream.getTracks().forEach(t=>t.stop()); }catch(e){}
  camStream=null; camTask=null; camGps=null;
  render();
}
async function camShoot(){
  if(camBusy || !camTask) return;
  const v=document.getElementById('cam-video');
  if(!v || !v.videoWidth){ toast('Hintayin munang lumabas ang larawan.'); return; }
  camBusy=true;
  const layon=camTask.purpose||'task', anoKind=camTask.kind||null;
  const kuha=new Date().toISOString();     // ORAS NG PAGKUHA — ito ang opisyal
  try{
    const maxW=1024;
    const w=Math.min(v.videoWidth, maxW);
    const h=Math.round(v.videoHeight * (w/v.videoWidth));
    const c=document.createElement('canvas'); c.width=w; c.height=h;
    c.getContext('2d').drawImage(v,0,0,w,h);
    const b64=c.toDataURL('image/jpeg', 0.5);
    const task=camTask.id, g=camGps||{};
    camClose();
    const lugar={lat:(g.lat!=null?g.lat:null), lng:(g.lng!=null?g.lng:null),
                 acc:(g.acc!=null?g.acc:null), captured_at:kuha};
    // Sa pila muna — doon ito ipapadala, kaya pareho ang daan kahit may
    // signal o wala. Hindi nawawala ang litrato kahit mamatay ang app.
    if(layon==='shift'){
      shiftEnqueue(anoKind, b64, lugar);
      camBusy=false;
      return;
    }
    const naitabi = enqueue('taskphoto', Object.assign(
      {task_id:task, status:'done', reason:'', photo_b64:b64}, lugar));
    if(naitabi){
      toast(navigator.onLine ? '📷 Kuha na. Ipinapadala…'
                             : '📷 Kuha na. Ipapadala pagkaroon ng signal.', 4000);
    }
    render();
    if(navigator.onLine) syncQueue(true).then(()=>loadTasks());
  }catch(e){
    camBusy=false;
    toast('Hindi nakuha ang litrato. Subukan ulit.');
    return;
  }
  camBusy=false;
}
/* ---- PASOK AT LABAS ----
   Kada pasok at kada labas, may litrato at GPS.

   HINDI ITO HUMAHARANG. Kung tumanggi ang camera, kung walang permiso, o
   kung kinansela — NAITATALA PA RIN ang pasok o labas, pero WALANG LITRATO
   ang nakasulat, at iyon ang lumalabas sa Telegram at sa dashboard ni Owner.
   Mas mabuti ang talang may butas kaysa sa staff na hindi makapagbenta — at
   mas mabuti ang nakikitang butas kaysa sa katahimikan. */
function shiftEnqueue(kind, b64, lugar, dahil){
  const tok = (session && session.token) || null;
  const naitabi = enqueue('shift', Object.assign(
    {kind:kind, photo_b64: b64||null, __tok: tok}, lugar||{}));
  if(naitabi && !b64 && dahil==='camera'){
    // Isang mensahe lang, pero kumpleto: ang nangyari AT ang aayusin.
    const ano = kind==='in' ? 'TIME IN' : 'TIME OUT';
    toast('⚠️ Naitala ang '+ano+' PERO WALANG LITRATO — naka-BLOCK ang camera.'
         +' Ayusin: pindutin ang 🔒 sa tabi ng address sa Chrome → Permissions'
         +' → Camera → Allow, tapos i-refresh.', 12000);
    shiftMe = shiftMe || {};
    shiftMe[kind] = {oras:(lugar&&lugar.captured_at)||new Date().toISOString(),
                     may_litrato:false, hinihintay:true};
    render();
    if(navigator.onLine) syncQueue(true).then(()=>loadShiftMe());
    return;
  }
  if(naitabi){
    // Agad na ipinapakita ang bagong kalagayan, kahit hindi pa naipapadala.
    // Kung hindi, aakalain niyang hindi tumalab ang pindutan at uulitin
    // niya — at madodoble ang tala.
    shiftMe = shiftMe || {};
    shiftMe[kind] = {oras:(lugar&&lugar.captured_at)||new Date().toISOString(),
                     may_litrato: !!b64, hinihintay: true};
    const ano = kind==='in' ? 'TIME IN' : 'TIME OUT';
    toast(b64 ? (navigator.onLine ? '📷 '+ano+' na. Ipinapadala…'
                                  : '📷 '+ano+' na. Ipapadala pagkaroon ng signal.')
              : '⚠️ '+ano+' na PERO WALANG LITRATO.', 5000);
  }
  render();
  if(navigator.onLine) syncQueue(true).then(()=>loadShiftMe());
}
async function shiftCapture(kind){
  camTask=null;
  await camOpen('shift_'+kind, kind==='in' ? 'TIME IN — kunan ang tindahan'
                                           : 'TIME OUT — kunan ang tindahan', 'shift', kind);
  // PALYADONG CAMERA: itala pa rin, may babala. Kung hindi, hindi siya
  // makaka-time in habang nakasara ang camera sa Settings — at hindi iyon
  // dapat dahilan para hindi siya mabayaran.
  //
  // SINASABI ANG DAHILAN. Dati, may dalawang mensaheng sunod-sunod: una ang
  // "I-allow ang Camera sa Settings" mula sa camOpen, tapos agad itong
  // natatabunan ng "walang litrato" — kaya nakikita ng staff ang BUNGA pero
  // hindi ang DAHILAN, at hindi nila alam na may aayusin pala.
  if(!camTask) shiftEnqueue(kind, null, {captured_at:new Date().toISOString()}, 'camera');
}
// ANG PAGKANSELA AY PAG-URONG, HINDI PAGTAKAS.
// Dati, ang kansela ay nagtatala pa rin nang walang litrato — tama iyon
// noong nakakabit ito sa logout, dahil kailangang may tala kahit ano pa.
// Ngayong sariling pindutan na ito, ang kansela ay "mamaya na lang":
// WALANG itinatala, at mananatiling PULA ang babala hanggang mag-time in
// siya. Hindi ito butas — ang hindi pag-time-in ay nakikita mo mismo.
function camCancel(){
  const layon=camTask&&camTask.purpose;
  camClose();
  if(layon==='shift') toast('Hindi pa naka-TIME IN. Pindutin ulit kapag handa na.', 4000);
}

/* ---- ANG KALAGAYAN NGAYONG ARAW ---- */
async function loadShiftMe(){
  if(!session) return;
  const r = await call('shift_me', {});
  if(r && r.ok){ shiftMe = {in:r.in||null, out:r.out||null}; }
  else if(shiftMe===null){
    // PALYADO ANG PAGTATANONG — walang signal, o luma pa ang server.
    // Huwag itago ang TIME IN: kapag itinago, WALA siyang mapipindot at
    // walang matatala kahit anong oras siya dumating. Mas mabuti ang
    // "hindi pa naka-time in" kaysa sa walang pindutan. Kung naka-time in
    // na pala siya, hindi madodoble: tinatanggihan ng server ang pangalawang
    // TIME IN sa iisang araw — ibinabalik nito ang nauna, at walang bagong

    shiftMe = {in:null, out:null};
  }
  render();
}

function viewTala(){
  const tabs=[['log','📓','Logbook'],['open','🌅','Opening'],
              ['close','🌙','Closing'],['dala','🎒','Dalahin']];
  const head=`<div class="card" style="padding:8px">
    <div class="grid" style="grid-template-columns:repeat(4,1fr);gap:6px">
      ${tabs.map(([k,i,l])=>`<button class="tile${talaTab===k?' on':''}" data-talatab="${k}"
        style="text-align:center;padding:8px 4px;${talaTab===k?'border-color:#1b3a2f;background:#eaf3ee':''}">
        <b style="font-size:12px">${i}<br>${esc(l)}</b></button>`).join('')}
    </div></div>`;
  if(talaTab==='open')  return head + viewChecklist('opening');
  if(talaTab==='close') return head + viewChecklist('closing');
  if(talaTab==='dala')  return head + viewDalahin();
  return head + viewLogbook();
}

/* ANG CHECKLIST. Kapareho ng MAIN app: tsek kung nagawa, o LAKTAW na may
   DAHILAN. Ang laktaw na walang dahilan ay walang kwentang tala — kaya
   hinihingi ito bago tanggapin. */
function viewChecklist(which){
  if(ckRows===null){
    return `<div class="card"><h2>${which==='opening'?'🌅 Opening':'🌙 Closing'}</h2>
      <p class="hint">${navigator.onLine?'Kinukuha...':'Walang signal. Kailangan ng signal para makuha ang listahan.'}</p>
      ${navigator.onLine?'':'<div class="sp"></div><button class="ghost" id="ck-retry">Subukan ulit</button>'}</div>`;
  }
  const rows=(ckRows||[]).filter(r=>r.checklist===which);
  if(!rows.length){
    return `<div class="card"><h2>${which==='opening'?'🌅 Opening':'🌙 Closing'}</h2>
      <p class="hint">Wala pang nakalagay na task para sa tindahan na ito.
        Ipaayos sa Owner sa MAIN APP.</p></div>`;
  }
  const sent=(ckSent||[]).find(x=>x.checklist===which);
  const done=rows.filter(r=>r.status==='done').length;
  const skip=rows.filter(r=>r.status==='skip').length;
  const wala=rows.filter(r=>!r.status).length;
  const pri=(p)=>{const l=String(p||'').toLowerCase();
    return l==='very high'?'<span class="pill bad">mahalaga</span>'
         : l==='high'?'<span class="pill warn">mataas</span>':'';};
  return `<div class="card">
    <h2>${which==='opening'?'🌅 Opening':'🌙 Closing'} · ${esc(ckPetsa||businessDate())}</h2>
    <div class="line"><span>Nagawa</span><b>${done} / ${rows.length}</b></div>
    ${skip?`<div class="line"><span>Hindi nagawa (may dahilan)</span><b>${skip}</b></div>`:''}
    ${wala?`<div class="line"><span>Walang sagot pa</span><b>${wala}</b></div>`:''}
    ${(()=>{ const q=queue.filter(x=>x.kind==='taskphoto').length;
      return q?`<div class="note" style="margin-top:8px">📷 ${q} litrato ang hindi pa
        naipapadala. Naitala na ang ORAS NG PAGKUHA — hindi mawawala. Ipapadala
        pagkaroon ng signal.</div>`:''; })()}
    ${sent?`<div class="note ok" style="margin-top:8px">✓ Naisumite na ni ${esc(sent.by_name||'?')}
      ${sent.oras?'· '+esc(sent.oras):''} — ${sent.n_done}/${sent.n_task} ang nagawa.
      Pwede pa ring ituloy ang kulang; isumite ulit pagkatapos.</div>`:''}
  </div>
  <div class="card">
    ${rows.map(r=>`<div style="border-top:1px solid var(--line);padding:8px 0">
      <div style="font-size:13px">
        ${r.status==='done'?'✅':r.status==='skip'?'⚠️':'⬜'} <b>${esc(r.text)}</b>
        ${pri(r.priority)}${r.time?' <span class="hint">'+esc(r.time)+'</span>':''}
      </div>
      ${r.status?`<div class="hint">${r.status==='done'?'Nagawa':'HINDI nagawa'} ni
        ${esc(r.done_by||'?')}${r.oras?' · '+esc(r.oras):''}
        ${r.status==='skip'&&r.reason?'<br>Dahilan: '+esc(r.reason):''}</div>`:''}
      ${r.needs_photo?`<div class="hint" style="margin-top:4px">
        📷 <b>Kailangan ng litrato at lokasyon.</b> Kunan ngayon mismo —
        walang gallery. Ang oras ng pagkuha ang itatala.
        ${r.may_litrato?'<br>✓ May litrato na'+(r.may_gps?' at lokasyon':' (walang GPS)')
          +(r.huli_minuto>5?' · dumating '+r.huli_minuto+' minuto ang huli':''):''}
      </div>`:''}
      <div class="row" style="margin-top:6px">
        ${r.needs_photo
          ? `<button class="${r.status==='done'?'ghost':''} sm" data-ckshoot="${esc(r.id)}">
              ${r.status==='done'?'📷 Kunan ulit':'📷 Kunan'}</button>`
          : `<button class="${r.status==='done'?'':'ghost'} sm" data-ckdone="${esc(r.id)}">
              ${r.status==='done'?'✓ Nagawa':'Nagawa'}</button>`}
        <button class="${r.status==='skip'?'warn':'ghost'} sm" data-ckskip="${esc(r.id)}">
          ${r.status==='skip'?'⚠️ May dahilan':'Hindi nagawa'}</button>
        ${r.status?`<button class="ghost sm" data-ckclear="${esc(r.id)}">Alisin</button>`:''}
      </div>
    </div>`).join('')}
  </div>
  <div class="card">
    <button id="ck-submit" data-cksubmit="${which}">📤 Isumite ang ${which==='opening'?'opening':'closing'}</button>
    <p class="hint" style="margin-top:8px">Tinatanggap ito kahit may kulang —
      <b>pero naitatala ang kulang at ipinapaalam kay Owner</b>. Mas mabuting
      sabihin ang totoo kaysa magtsek ng hindi ginawa.</p>
  </div>`;
}

/* ANG DALAHIN. Dalawang bahagi:
     1. KAGAMITAN — tent, stove, gasul, kaldero. Hindi stock, paroo't parito
        lang araw-araw. Tsek lang.
     2. CONSUMABLE — ang laging dinadala. Dito NAKIKITA lang; ang dami ay
        sa PADALA galing sa Tinago, at Owner/Manager ang naglalagay. */
function viewDalahin(){
  const gamit=(ckRows||[]).filter(r=>r.checklist==='dalahin');
  const pack=(ckPack||[]);
  const sent=(ckSent||[]).find(x=>x.checklist==='dalahin');
  const done=gamit.filter(r=>r.status==='done').length;
  return `<div class="card">
    <h2>🎒 Ang dalahin · ${esc(ckPetsa||businessDate())}</h2>
    <p class="hint">Pop-up ang tindahang ito — walang naiiwan. Ito ang listahan
      para hindi na hanapin araw-araw.</p>
  </div>
  <div class="card">
    <h2>Kagamitan${gamit.length?' · '+done+' / '+gamit.length:''}</h2>
    ${gamit.length? gamit.map(r=>`<div style="border-top:1px solid var(--line);padding:7px 0">
      <div style="font-size:13px">${r.status==='done'?'✅':r.status==='skip'?'⚠️':'⬜'}
        <b>${esc(r.text)}</b></div>
      ${r.status==='skip'&&r.reason?`<div class="hint">Dahilan: ${esc(r.reason)}</div>`:''}
      <div class="row" style="margin-top:5px">
        <button class="${r.status==='done'?'':'ghost'} sm" data-ckdone="${esc(r.id)}">
          ${r.status==='done'?'✓ Dala':'Dala'}</button>
        <button class="${r.status==='skip'?'warn':'ghost'} sm" data-ckskip="${esc(r.id)}">
          ${r.status==='skip'?'⚠️ Wala':'Wala'}</button>
        ${r.status?`<button class="ghost sm" data-ckclear="${esc(r.id)}">Alisin</button>`:''}
      </div></div>`).join('')
    : `<p class="hint">${ckRows===null
        ? (navigator.onLine?'Kinukuha...':'Walang signal.')
        : 'Wala pang nakalagay na kagamitan. Ipaayos sa Owner sa MAIN APP.'}</p>`}
    ${gamit.length?`<div class="sp"></div>
      <button data-cksubmit="dalahin">📤 Isumite ang dalahin</button>
      ${sent?`<p class="hint" style="margin-top:6px">✓ Naisumite na ni ${esc(sent.by_name||'?')}
        ${sent.oras?'· '+esc(sent.oras):''}.</p>`:''}`:''}
  </div>
  <div class="card">
    <h2>Laging dinadalang stock${pack.length?' · '+pack.length:''}</h2>
    <p class="hint">Ito ang dumadaan sa <b>PADALA</b> galing sa Tinago.
      Hindi dito inilalagay ang dami — tingnan ang <b>Dala</b> tab para sa
      padalang dumating na.</p>
    ${pack.length? pack.map(p=>`<div class="line">
      <span style="font-size:13px">${p.naitugma?'📦':'⚠️'}
        <b>${esc(p.naitugma ? (p.inv_name||p.name) : p.name)}</b>
        <span class="hint"> (${esc(p.naitugma ? (p.inv_unit||'') : (p.unit_hint||''))})</span>
        ${p.naitugma
          ? (p.inv_name && p.inv_name!==p.name
              ? '<br><span class="hint">sa papel: '+esc(p.name)+'</span>' : '')
          : '<br><span class="hint">hindi pa naitugma sa inventory ni Owner</span>'}</span>
    </div>`).join('')
    : `<p class="hint">${ckPack===null
        ? (navigator.onLine?'Kinukuha...':'Walang signal.')
        : 'Wala pang listahan. Ipaayos sa Owner sa MAIN APP.'}</p>`}
  </div>`;
}

/* ---- ANG BABALA NG TIME IN ----
   Nasa itaas ng lahat ng tab. Ang TIME IN ay malaki at pula hangga't hindi
   pa nagagawa; ang TIME OUT ay nasa "Iba pa" lang, hindi dito — para hindi
   ito mapindot nang aksidente habang may pila ng customer. */
function shiftOras(t){
  if(!t) return '';
  try{ return new Date(t).toLocaleTimeString('en-PH',
    {timeZone:'Asia/Manila',hour:'numeric',minute:'2-digit'}); }
  catch(e){ return ''; }
}
function viewShiftBar(){
  if(!session || shiftMe===null) return '';          // hindi pa alam: tahimik
  const pasok=shiftMe.in, labas=shiftMe.out;
  if(!pasok){
    return `<div class="card" style="border:2px solid #c0392b;">
      <h2 style="color:#c0392b; margin-top:0;">⏰ HINDI KA PA NAKA-TIME IN</h2>
      <p class="hint">Pindutin ito pagdating mo sa tindahan. Magpipicture ka,
        at doon makikita ni Owner kung anong oras ka dumating. <b>Isang beses
        lang ito sa buong araw</b> — hindi na ito hihingin sa tuwing bubuksan
        mo ang app.</p>
      <button id="sh-in" style="background:#c0392b;">📷 TIME IN</button>
    </div>`;
  }
  if(!labas){
    return `<div class="line" style="padding:7px 12px; background:rgba(22,160,133,.12);
        border-bottom:1px solid var(--line);">
      <span>✅ TIME IN <b>${shiftOras(pasok.oras)}</b>${pasok.hinihintay?' <span class="hint">(ipapadala pa)</span>':''}
        ${pasok.may_litrato===false?' <span class="hint">⚠️ walang litrato</span>':''}</span>
      <span class="hint">TIME OUT → Iba pa</span>
    </div>`;
  }
  return `<div class="line" style="padding:7px 12px; border-bottom:1px solid var(--line);">
    <span class="hint">TIME IN ${shiftOras(pasok.oras)} · TIME OUT ${shiftOras(labas.oras)}</span>
  </div>`;
}

/* ============================================================
   BIND
   ============================================================ */
function bind(){
  const on=(id,fn)=>{ const e=document.getElementById(id); if(e) e.addEventListener('click',fn); };
  document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>{
    window.__payOpen=false; posItem=null; posPick=null; posFlavors={}; route=b.dataset.nav;
    carryMode=null; countResult=null;
    render();
    // KUSANG KUMUKUHA SA BAWAT PAGLIPAT. Dati, ang datos ay kinukuha lang
    // sa unang pagbukas — kaya kahit matagal nang naipadala ang stock,
    // luma pa rin ang nakikita hangga't hindi pinipindot ang 🔄.
    refreshFor(route);
  }));

  // --- activate ---
  on('ac-go', async()=>{
    if(busy) return;
    const code=(document.getElementById('ac-code').value||'').trim();
    const otp =(document.getElementById('ac-otp').value||'').trim();
    const label=(document.getElementById('ac-label').value||'').trim();
    if(code.length!==6 || otp.length!==6){ toast('Anim na numero ang bawat isa.'); return; }
    busy=true; toast('Nirerehistro...');
    const r = await call('activate', {code, totp:otp, label});
    busy=false;
    if(!r || !r.ok){ toast((r&&r.reason)||'Hindi nagawa.', 5000); return; }
    deviceToken=r.device_token; deviceId=r.device_id;
    LS.set('device_token', deviceToken); LS.set('device_id', deviceId);
    toast('✓ Nakarehistro na ang teleponong ito.');
    render();
    loadWho();
  });

  // --- login ---
  on('lg-refresh', loadWho);
  on('lg-go', async()=>{
    if(busy) return;
    const pinEl=document.getElementById('lg-pin');
    const whoEl=document.getElementById('lg-who');
    const pin=(pinEl && pinEl.value || '');
    const sid=(whoEl && whoEl.value || '');
    if(!sid){ toast('Piliin muna ang pangalan mo.'); return; }
    if(pin.length<4){ toast('Apat na karakter man lang ang PIN.'); return; }
    busy=true;
    const r = await call('login', {pin, staff_id:sid});
    busy=false;
    if(pinEl) pinEl.value='';
    if(!r || !r.ok){ toast((r&&r.reason)||'Hindi makapasok.', 4500); return; }
    session={token:r.session_token, store_id:r.store_id, staff_name:r.staff_name,
             must_change:!!r.must_change, at:Date.now()};
    lastTouch=Date.now(); loadWho();
    LS.set('session', session);
    await loadMenu();
    await refreshState();
    syncQueue(true);
    // Sariwa ang lahat pagkapasok — kasama ang DALA. Dati, kailangan pang
    // pindutin ang 🔄 bago makita ang padalang matagal nang naipadala, kaya
    // akala ng staff hindi pa naipapadala.
    pendingCarries=null; balikList=null; countList=null;
    loadCarry();
    render();
    // WALANG LITRATO SA PAG-LOGIN (L225). Ang pagbukas ng app ay HINDI
    // pagdating sa tindahan — pwedeng nasa bahay pa siya, o binuksan lang
    // ulit ang app. Ang TIME IN ang may litrato, at iyon ay sariling
    // pindutan. Kinukuha lang dito kung naka-time in na siya ngayong araw.
    loadShiftMe();
  });

  // --- palit ng PIN ---
  on('pc-go', async()=>{
    if(busy) return;
    const o=(document.getElementById('pc-old').value||'');
    const n=(document.getElementById('pc-new').value||'');
    const n2=(document.getElementById('pc-new2').value||'');
    if(n.length<4 || n.length>10){ toast('Apat hanggang sampung karakter ang bagong PIN.'); return; }
    if(n!==n2){ toast('Hindi magkatugma ang inulit.'); return; }
    if(n===o){ toast('Iba naman sa binigay sa\'yo ang ilagay.'); return; }
    busy=true;
    const r = await call('pin', {old:o, new:n});
    busy=false;
    if(!r || !r.ok){ toast((r&&r.reason)||'Hindi napalitan.', 4500); return; }
    session.must_change=false; LS.set('session', session);
    toast('✓ Napalitan. Ikaw na lang ang may alam nito.', 4000);
    await loadMenu(); await refreshState(); render();
  });

  // --- POS ---
  const ciKind=document.getElementById('ci-kind');
  const ciToggle=()=>{
    const isExp=(ciKind&&ciKind.value)!=='cash_in';
    const v=document.getElementById('ci-vendor-wrap');
    const s=document.getElementById('ci-source-wrap');
    if(v) v.style.display = isExp ? 'block' : 'none';
    if(s) s.style.display = isExp ? 'block' : 'none';
  };
  if(ciKind){ ciKind.addEventListener('change', ciToggle); ciToggle(); }
  on('ci-go', async()=>{
    const kind=(document.getElementById('ci-kind')||{}).value||'expense';
    const desc=((document.getElementById('ci-desc')||{}).value||'').trim();
    const vend=((document.getElementById('ci-vendor')||{}).value||'').trim();
    const amt =Number(((document.getElementById('ci-amount')||{}).value||'').trim());
    const src =(document.getElementById('ci-source')||{}).value||'drawer';
    if(desc.length<2){ toast('Ilagay kung para saan.'); return; }
    if(!isFinite(amt) || amt<=0){ toast('Ilagay ang halaga.'); return; }
    if(!confirm((kind==='expense'?'Gastos':'Dagdag na cash')+' na '+peso(amt)+' para sa "'+desc+'"?'
       +(kind==='expense'?'\n\nHindi muna ito babawas sa kaha hangga\'t hindi inaaprubahan ni Owner.':''))) return;
    enqueue('item', { id:'ci_'+uid(), kind, description:desc, vendor:vend||null,
      amount:amt, source:src, by_name:(session&&session.staff_name)||null,

      // Isa lang. Pindot ulit sa parehong pagpipilian = alisin.

    else { addToCart(it, v.label, price); posItem=null; render(); }

  document.querySelectorAll('[data-dec]').forEach(b=>b.addEventListener('click',()=>{

    l.qty--; if(l.qty<=0) cart.splice(i,1); else l.line_total=l.qty*l.unit_price;

  on('pos-clear', ()=>{ if(confirm('Burahin ang buong order?')){ cart=[]; render(); } });
  on('pos-pay', ()=>{ if(!cart.length) return; window.__payOpen=true; render(); });
  on('pay-back', ()=>{ window.__payOpen=false; render(); });
  const dsel=document.getElementById('pay-disc');
  if(dsel) dsel.addEventListener('change',()=>{
    document.getElementById('pay-discbox').style.display = dsel.value ? 'block':'none';
  });
  // SUKLI — kinukwenta habang nagta-type, para hindi na mag-isip ang cashier.

  const tEl=document.getElementById('pay-tendered');

  const sukliDraw=()=>{
    if(!sEl) return;
    const isCash=!pEl || pEl.value==='cash';
    if(boxEl) boxEl.style.display = isCash ? 'block':'none';
    const total=cartTotal();
    const raw=(tEl && tEl.value || '').trim();

    const n=Number(raw);
    if(!isFinite(n)){ sEl.textContent='—'; sEl.style.color=''; return; }
    const d=n-total;
    sEl.textContent = peso(Math.abs(d)) + (d<0?' KULANG':'');

    // Kung pinagsama, lalabas na sobra ang kaha kada araw.

  });
  on('cnt-cancel', ()=>{ carryMode=null; countDraft={}; countResult=null; render(); });
  on('cnt-done', ()=>{ carryMode=null; countDraft={}; countResult=null; countList=null; render(); });

  }));

  on('cnt-save', async()=>{

    const lines=(countList||[]).map(x=>{

  on('rcv-cancel', ()=>{ carryMode=null; rcvDraft={}; render(); });
  document.querySelectorAll('[data-rcvgo]').forEach(b=>b.addEventListener('click',()=>{

  on('bk-save', async()=>{

    const r=await call('balik', {lines});
    busy=false;
    if(!r || !r.ok){ toast((r&&r.reason)||'Hindi naitala. Kailangan ng signal dito.', 5000); return; }

  on('lg-new',    ()=>{ logOpen=true;  render(); });

  document.querySelectorAll('[data-logkind]').forEach(b=>b.addEventListener('click',()=>{

    });

  document.querySelectorAll('[data-logack]').forEach(b=>b.addEventListener('click',async()=>{

      else toast('❌ '+((r&&r.reason)||'Hindi naitala.'), 4000);
    }catch(e){ toast('Hindi naitala.'); }
    finally{ busy=false; render(); }
  }));

  on('mr-sync', ()=>syncQueue(false));
  on('mr-menu', loadMenu);
  on('mr-print', connectPrinter);
  // MULING PAG-PRINT. May tala at may abiso kay Owner — sinasabi ito nang
  // harap-harapan sa nagpi-print, hindi palihim. Ang dahilan ay hinihingi
  // dahil ang walang dahilan ay siya mismong bandila.
  on('mr-reprint', async()=>{
    if(!lastOrder) return;
    const why=prompt('Bakit ipi-print ulit ang '+lastOrder.order_no+'?\n\n'
      +'(hal. nasira ang papel, hindi lumabas)\n\n'
      +'Ang bawat reprint ay may tala at napapadala kay Owner.');

    const r=await call('reprint', {order_no:lastOrder.order_no, reason:why});

  on('mr-out', ()=>{
    if(queue.length && !confirm(queue.length+' ang hindi pa naipapadala.\n\nMananatili ito sa teleponong ito. Mag-logout pa rin?')) return;
    // WALANG LITRATO SA LOGOUT (L225). Ang paglabas sa app ay hindi
    // pag-uwi — madalas nga ay nag-lologout lang sila para magpalit ng tao.
    // Ang TIME OUT ang may litrato, at sariling pindutan iyon.
    if(shiftMe && shiftMe.in && !shiftMe.out
       && !confirm('HINDI KA PA NAKA-TIME OUT.\n\nMag-logout pa rin?\n\n'
                  +'Kung uuwi ka na, i-cancel mo ito at pindutin muna ang TIME OUT.')) return;
    session=null; LS.del('session'); route='pos'; window.__whoTried=false;
    shiftMe=null; render();
  });
}

function addToCart(it, label, price, flavor, flavorArr){
  const name = label ? (it.name+' — '+label) : it.name;
  const fl = flavor || '';
  // Ang PAREHONG item at PAREHONG lasa lang ang pinagsasama. Ang
  // magkaibang lasa ay magkahiwalay na linya — kung hindi, hindi malalaman
  // ng kusina kung alin ang Buffalo at alin ang BBQ.
  const found = cart.find(l=>l.item_name===name && (l.flavor||'')===fl
                             && Number(l.unit_price)===(Number(price)||0));
  if(found){ found.qty++; found.line_total=found.qty*found.unit_price; }
  else cart.push({menu_item_id:it.id, variant_label:label, item_name:name,
                  flavor: fl || null, modifiers: flavorArr || [],
                  qty:1, unit_price:Number(price)||0, line_total:Number(price)||0});
  render();
}

async function loadMenu(){
  const r = await call('menu', {});
  if(r && r.ok && r.menu){
    menu = r.menu; LS.set('menu', menu);
    if(r.state && r.state.ok) dayState = r.state;
    toast('✓ Bagong menu.');
  }else if(menu){
    toast('Walang signal — ginagamit ang huling menu.', 3500);
  }else{
    toast((r&&r.reason)||'Hindi makuha ang menu.', 4000);
  }
  render();
}

function nextOrderNo(){
  const bd = businessDate();
  let ctr = LS.get('ctr', {d:null, n:0});
  if(ctr.d !== bd) ctr = {d:bd, n:0};
  ctr.n++; LS.set('ctr', ctr);
  const dev = String(deviceId||'00').slice(-2).toUpperCase();
  return 'BLV-'+dev+'-'+String(ctr.n).padStart(6,'0');
}

async function finishOrder(){
  if(busy || !cart.length) return;
  busy=true;
  const dsel=document.getElementById('pay-disc');
  const disc = dsel ? dsel.value : '';
  const damt = disc ? (Number((document.getElementById('pay-discamt').value||'0'))||0) : 0;
  const ptype = (document.getElementById('pay-type')||{}).value || 'cash';
  const total = Math.max(0, cartTotal() - damt);
  // Ang ibinayad ay para sa SUKLI sa resibo. Kulang o blangko: hindi
  // ipapalimbag — mas mabuting walang sukli kaysa maling sukli.
  const tRaw = (document.getElementById('pay-tendered')||{}).value || '';
  const tend = (ptype==='cash' && String(tRaw).trim()!=='') ? Number(tRaw) : 0;
  const order = {
    id: 'ord_'+uid(),
    order_no: nextOrderNo(),
    cashier_name: session.staff_name,
    ordered_at: new Date().toISOString(),
    total: total,
    payment_type: ptype,
    kind: disc==='staff' ? 'staff_meal' : 'sale',
    discount_type: disc || null,
    discount_amount: damt,
    cash_tendered: (isFinite(tend) && tend >= total) ? tend : 0,
    lines: cart.map((l,i)=>({n:i+1, ...l}))
  };
  // NAITALA MUNA SA TELEPONO. Kahit mamatay ang signal o ang printer,
  // hindi nawawala ang benta.
  enqueue('order', order);
  lastOrder = order;
  cart = []; window.__payOpen=false;
  busy=false;
  render();
  toast('✓ '+order.order_no);
  printStub(order);
  syncQueue(true);
}

/* ============================================================
   SIMULA
   ============================================================ */
(function start(){
  render();
  if(session){ loadMenu(); refreshState(); syncQueue(true); }
  // Ang PWA ay nananatiling bukas buong gabi — i-refresh ang bilang paminsan.
  setInterval(()=>{ if(session && route==='kaha') refreshState(); }, 60000);
})();
</script>
